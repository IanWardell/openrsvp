# golangci-lint v2 configuration (used by golangci-lint-action v8).
# Deliberately lenient: a conservative linter set so CI surfaces real issues
# without failing on pre-existing style across the codebase. The lint job in CI
# is also marked continue-on-error, so these findings are advisory.
version: "2"

run:
  # Target Go 1.24 language semantics. The repo's go.mod declares a bleeding-edge
  # toolchain (go1.26.3); without this, golangci-lint (whose binary is built with
  # an older Go) aborts with "the Go language version used to build golangci-lint
  # is lower than the targeted Go version". Pinning the target sidesteps that.
  go: "1.24"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused

issues:
  # Show all findings rather than truncating per-linter/per-file.
  max-issues-per-linter: 0
  max-same-issues: 0
