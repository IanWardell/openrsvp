<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;background:#f5f5f4;font-family:Arial,sans-serif;color:#1c1917">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;background:#f5f5f4">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e7e5e4;border-radius:14px;overflow:hidden">
        <tr><td style="padding:24px 28px;background:{{.Colors.Primary}};color:#ffffff;font-size:22px;font-weight:700">OpenRSVP</td></tr>
        <tr><td style="padding:28px">
          <h1 style="margin:0 0 16px;font-size:22px">New {{.Role}}</h1>
          <p style="margin:0 0 20px;line-height:1.6">
            {{if .Name}}<strong>{{.Name}}</strong> ({{.Email}}){{else}}<strong>{{.Email}}</strong>{{end}}
            now has the <strong>{{.Role}}</strong> role.
          </p>
          <a href="{{.UsersURL}}" style="display:inline-block;padding:11px 18px;border-radius:10px;background:{{.Colors.Primary}};color:#ffffff;text-decoration:none;font-weight:600">Review platform users</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
