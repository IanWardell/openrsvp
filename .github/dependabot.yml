version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "10:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      go-routine-updates:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/web"
      - "/tests/e2e"
    schedule:
      interval: "monthly"
      time: "10:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      npm-routine-updates:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security-updates:
        applies-to: "security-updates"
        patterns: ["*"]
    ignore:
      # SvelteKit 2.70.2 supports TypeScript 5 and 6, but not TypeScript 7.
      - dependency-name: "typescript"
        versions: ["7.x"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "10:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      docker-routine-updates:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-security-updates:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "10:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions-routine-updates:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security-updates:
        applies-to: "security-updates"
        patterns: ["*"]
